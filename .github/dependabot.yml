version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /.github/release
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      release-tooling:
        patterns: ["*"]

name: Check Format

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: check-format-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes outside the docs
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$BASE" "$GITHUB_SHA" | tee changed.txt
          if grep -v -E '^(.*\.md|docs/.*|LICENSE.*)$' changed.txt | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed; skipping the macOS job."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.5"

      - name: Format Check
        id: format
        run: |
          swift format --version
          swift format format -r ./Magic\ Switch/ -i
          git diff > format.diff
          if [ -s format.diff ]; then
            echo "format_has_issues=true" >> "$GITHUB_OUTPUT"
            echo "diff=$(base64 -i format.diff)" >> "$GITHUB_OUTPUT"
          fi

      - name: Report formatting issues
        if: steps.format.outputs.format_has_issues == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FORMAT_DIFF_BASE64: ${{ steps.format.outputs.diff }}
        with:
          script: |
            const diff = Buffer.from(process.env.FORMAT_DIFF_BASE64, 'base64').toString();

            // Split diff by files
            const files = diff.split('diff --git').slice(1);
            const formattedDiffs = files.map(file => {
              const lines = file.split('\n');
              const filePath = lines[0].match(/b\/(.*)/)[1];
              return `### ${filePath}\n\n\`\`\`diff\ndiff --git ${file}\`\`\`\n`;
            }).join('\n');

            const message = `
            ## Formatting Issues Found

            The following files have formatting issues:

            ${formattedDiffs}

            ### How to Fix
            1. Run \`swift format format -r ./Magic\\ Switch/ -i\` locally
            2. Commit and push the changes

            You can set up git hooks to automatically format code on commit:

            \`\`\`bash
            sh ./setup-hooks.sh
            \`\`\`
            `;

            await core.summary.addRaw(message).write();
            core.setFailed('Format check failed');
